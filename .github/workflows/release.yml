name: release

# Foverlay's release pipeline, modeled on the Turma/Tenir unified release
# model, single-component (the Android APK is the only artifact):
#
#   - ONE v<MAJOR>.<MINOR>.<PATCH> tag per release, with the APK attached to
#     the GitHub Release as foverlay-v<version>.apk.
#   - PATCH is derived from the existing v* tags (max+1), never committed —
#     the auto-patch path is read-only against the repo and can't re-trigger
#     itself. Root VERSION holds MAJOR.MINOR only.
#   - A manual minor/major (workflow_dispatch) bumps VERSION on main first,
#     then builds and tags that commit.
#   - dry_run (the dispatch DEFAULT) exercises everything except the
#     mutations: the APK uploads as an Actions artifact and no tag / release /
#     commit is created.
#
# Triggers:
#   - push: main — the auto patch release, path-filtered to mobile/** because
#     a docs- or CI-only merge would otherwise mint a tag whose APK is
#     identical to the previous one. Release-machinery changes are therefore
#     NOT a trigger; rehearse them with a dry_run dispatch.
#   - workflow_dispatch — manual patch/minor/major and the dry_run rehearsal.
#
# Signing: the release build signs with the standard RN debug keystore (Expo
# template fallback — same certificate everywhere), so every release installs
# over the previous one. Private sideloaded app; no Play, no secrets.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      release_type:
        description: "patch (auto), or a manual minor/major bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Rehearse without tagging/releasing"
        type: boolean
        default: true

# Serialize releases so two never race on the tag. Rapid merges queue; the
# changelog is range-based (GitHub generated notes since the previous tag), so
# the surviving release still covers superseded merges' PRs.
concurrency:
  group: foverlay-release
  cancel-in-progress: false

permissions:
  contents: write # tags, releases, the VERSION bump commit

jobs:
  # ------------------------------------------------------------------ plan ----
  # Read-only: compute the next version/tag from root VERSION + existing tags.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prev_tag: ${{ steps.plan.outputs.prev_tag }}
      dry_run: ${{ steps.flags.outputs.dry_run }}
      release_type: ${{ steps.flags.outputs.release_type }}
    steps:
      # Full history + tags: next-patch reads every v* tag; the default
      # shallow checkout fetches no tags and would return patch 0 forever.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve flags
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          # A push trigger has no inputs -> a real (non-dry) patch release.
          if [ "$EVENT_NAME" = "push" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "release_type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
            echo "release_type=${RELEASE_TYPE:-patch}" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute version
        id: plan
        env:
          RELEASE_TYPE: ${{ steps.flags.outputs.release_type }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < VERSION)"
          MAJOR="${BASE%%.*}"
          MINOR="${BASE#*.}"
          case "$RELEASE_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0 ;;
            minor) MINOR=$((MINOR + 1)) ;;
          esac
          # Highest existing patch for this major.minor line, +1 (0 if none).
          PATCH="$(git tag --list "v${MAJOR}.${MINOR}.*" \
            | sed -n "s/^v${MAJOR}\.${MINOR}\.\([0-9]\+\)$/\1/p" \
            | sort -n | tail -1)"
          if [ -n "$PATCH" ]; then PATCH=$((PATCH + 1)); else PATCH=0; fi
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "## Release v$VERSION (${RELEASE_TYPE}, prev: ${PREV_TAG:-none})" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ bump ----
  # Minor/major only, and only for real: land the new VERSION on main BEFORE
  # the build, so the tag lands on a commit whose VERSION already matches.
  # Patch releases never touch the repo. (Direct push — this repo has no
  # branch ruleset requiring PRs; if one is ever added, mirror Tenir's
  # bump-PR dance instead.)
  bump:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.release_type != 'patch'
      && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Bump VERSION and push
        id: commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "${VERSION%.*}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Release ${TAG}: bump VERSION to ${VERSION%.*}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------- build ----
  # Self-hosted (the xerktech aws github-runner EC2): JDK 17, node 20,
  # bun 1.2.22 and the Android SDK (/opt/android-sdk, licenses accepted) are
  # preinstalled on the box, with ANDROID_HOME/JAVA_HOME wired into the
  # runner services' .env — so no setup-* actions and no actions/cache: the
  # gradle/bun caches live on the runner's disk and persist between runs,
  # which is the whole point of self-hosting this job.
  build-apk:
    needs: [plan, bump]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.bump.result != 'failure'
    runs-on: [self-hosted, Linux, aws]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.3.x fails to resolve the file: @mentra/miniapp-cli
          # dep when installing mobile/ (resolver regression); 1.2.x works.
          # (Also preinstalled on the runner; this pins the job regardless.)
          bun-version: "1.2.22"

      - name: Clean generated project ONLY when dependencies changed
        working-directory: ./mobile
        # The self-hosted runner persists its checkout between builds, which is
        # what makes incremental Gradle builds fast. But `expo prebuild` does
        # NOT remove native-module linkage for packages DELETED since the last
        # build, and a stale node_modules can retain a removed package — so a
        # dependency change that builds fine on a clean checkout can fail here.
        #
        # So: wipe android/ + node_modules ONLY when package.json or the
        # lockfile actually changed vs the last build (tracked by a hash marker
        # on the runner). Code-only releases keep the generated project and
        # node_modules, so Gradle builds incrementally (~minutes instead of
        # ~20). Dependency releases do the full, safe clean.
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/../foverlay-deps.sha"   # persists in the runner _work tree
          current="$(cat package.json bun.lock 2>/dev/null | sha256sum | cut -d' ' -f1)"
          previous="$(cat "$marker" 2>/dev/null || echo none)"
          if [ "$current" != "$previous" ]; then
            echo "Dependencies changed ($previous -> $current) — full clean."
            rm -rf android node_modules
          else
            echo "Dependencies unchanged — keeping android/ + node_modules for an incremental build."
          fi
          echo "$current" > "$marker"

      - name: Install dependencies
        working-directory: ./mobile
        run: bun install

      - name: Setup environment
        working-directory: ./mobile
        # Expo reads mobile/.env. Stamp the unified release version in as the
        # app's versionName so the installed APK reports the release it came
        # from. versionCode comes from scripts/build-number.mjs (wall-clock
        # seconds — monotonic, so in-place updates always pass Android's
        # version check.)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cp .env.example .env
          sed "s|^EXPO_PUBLIC_MENTRAOS_VERSION=.*|EXPO_PUBLIC_MENTRAOS_VERSION=$VERSION|" .env > .env.tmp && mv .env.tmp .env
          grep "^EXPO_PUBLIC_MENTRAOS_VERSION=" .env

      - name: Run Expo prebuild
        working-directory: ./mobile
        run: bun expo prebuild --platform android

      - name: Build release APK
        working-directory: ./mobile/android
        # Memory discipline: the runner EC2 is 4-core/16GB and shares the box
        # with two sibling runner slots (docker builds for other repos). The
        # generated gradle.properties asks for an 8GB heap and four ABIs —
        # that thrashed 16GB on the hosted runners. Cap every JVM, cap
        # workers, and build arm64-v8a only (private sideloaded app; also
        # shrinks the APK ~5x).
        run: |
          df -h / | tail -1
          ./gradlew assembleRelease --build-cache --max-workers=2 \
            -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -PreactNativeArchitectures=arm64-v8a \
            "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            "-Pkotlin.daemon.jvmargs=-Xmx2048m"
          df -h / | tail -1
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Name the asset
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "foverlay-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-apk
          path: foverlay-v*.apk
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------- publish ----
  # Creates the tag + GitHub Release with the APK attached and GitHub's
  # generated notes (PRs since the previous tag). Skipped entirely on dry_run —
  # the APK is still inspectable as the asset-apk artifact.
  publish:
    needs: [plan, bump, build-apk]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.bump.result != 'failure'
      && needs.build-apk.result == 'success'
      && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: asset-apk
      - name: Create release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          PREV_TAG: ${{ needs.plan.outputs.prev_tag }}
          TARGET: ${{ needs.bump.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          NOTES_FLAGS=(--generate-notes)
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" foverlay-v*.apk \
            --title "Foverlay $TAG" \
            --target "$TARGET" \
            "${NOTES_FLAGS[@]}"
          echo "Released: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
