name: ci

# Nothing gated the TypeScript side of this repo: `.github/workflows/` held only
# release.yml, which builds the Android APK on a release push and is filtered to
# mobile/**. The SDK, the miniapp CLI, the glasses simulator and the mobile unit
# tests all ran only on developers' machines, so a broken `pack`, a drifted
# JSON Schema or a failing Jest suite reached main unnoticed (XERK-249).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk:
    name: SDK, CLI and simulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Same pin as release.yml: bun 1.3.x has a resolver regression on the
          # `file:` @veiller/miniapp-cli dependency. Keep the two in step.
          bun-version: "1.2.22"

      - name: Install dependencies
        run: bun install

      - name: Build the SDK
        # miniapp-cli and the simulator both import @veiller/miniapp's compiled
        # dist/, which is gitignored. The root postinstall builds it, but do it
        # explicitly so a postinstall that only warns cannot mask a broken build.
        working-directory: ./mobile/modules/miniapp
        run: bun run build

      - name: Typecheck the SDK
        working-directory: ./mobile/modules/miniapp
        run: bun run typecheck

      - name: Test the SDK
        working-directory: ./mobile/modules/miniapp
        run: bun test

      - name: Test the display pipeline
        # Scoped to src/utils/display rather than the whole engine suite: the
        # engine has pre-existing order-dependent failures in
        # AudioCloudUplink.test.ts (they pass in isolation, fail in a full run)
        # that are unrelated to display and would make this job permanently
        # red. Widen this once that flakiness is fixed.
        working-directory: ./mobile/modules/engine
        run: bun test src/utils/display

      - name: Test the miniapp CLI
        # `pack` shells out to zip(1); ubuntu-latest ships it.
        working-directory: ./sdk/miniapp-cli
        run: bun test

      - name: Test the glasses simulator
        working-directory: ./sdk/miniapp-simulator
        run: bun test

      - name: Check the published JSON Schema is in sync
        # schema/miniapp.schema.json is checked in and consumed by scaffolded
        # projects' `$schema`. It used to be regenerated by a `prepare` script
        # on every install; now that it is not, CI is what keeps it honest.
        run: |
          set -euo pipefail
          bun sdk/miniapp-cli/src/index.ts schema print > /tmp/schema-generated.json
          if ! diff -u sdk/miniapp-cli/schema/miniapp.schema.json /tmp/schema-generated.json; then
            echo "::error::schema/miniapp.schema.json is out of date. Run: bun sdk/miniapp-cli/src/index.ts schema regenerate"
            exit 1
          fi

  miniapps:
    name: Miniapps build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Install dependencies
        run: bun install

      - name: Build the SDK
        working-directory: ./mobile/modules/miniapp
        run: bun run build

      - name: Build and test every miniapp
        # Nothing covered miniapps/** before, which is how example-miniapp's
        # suite stayed red on a stale pre-rename filename assertion, and how
        # seven miniapps ended up with test files that no command ran.
        run: |
          set -euo pipefail
          failed=()
          for dir in miniapps/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            ( cd "$dir" && bun run build ) || failed+=("$name build")
            if bun --print "Boolean(require('./$dir/package.json').scripts?.test)" | grep -q true; then
              ( cd "$dir" && bun test ) || failed+=("$name test")
            else
              echo "no test script — nothing to run"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            printf '::error::failed: %s\n' "${failed[*]}"
            exit 1
          fi

  mobile:
    name: Mobile typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Setup environment
        working-directory: ./mobile
        # app.config.ts reads mobile/.env; the checked-in example is what CI
        # builds against (same convention as release.yml).
        run: cp .env.example .env

      - name: Install dependencies
        working-directory: ./mobile
        run: bun install

      - name: Typecheck
        working-directory: ./mobile
        run: bun run compile

      - name: Unit tests
        working-directory: ./mobile
        run: bun run test
