name: Android APK

# Foverlay: build the release APK on every push to main (and on demand).
# Modeled on upstream's mentra-app-android-build.yml.disabled, minus everything
# secret-gated: Mapbox is removed from the fork (NavigationManager is stubbed),
# and there is no Sentry/Doppler/Play-signing here. The release build type
# signs with the debug keystore (Expo template default), which is fine for a
# private sideloaded app.

on:
  push:
    branches:
      - main
      # Temporary, for validating this workflow pre-merge; removed once green:
      - foverlay/upstream-reset-tap-demo
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before:"; df -h / | tail -1
          # Keep the Android SDK — the build needs it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "After:"; df -h / | tail -1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun 1.3.x fails to resolve the file: @mentra/miniapp-cli
          # dep when installing mobile/ (resolver regression); 1.2.x works.
          bun-version: "1.2.22"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./mobile
        run: bun install

      - name: Setup environment
        working-directory: ./mobile
        # Expo reads mobile/.env. The example env is sufficient: Foverlay has
        # no Mapbox (removed), and Sentry stays off (empty DSN) by design.
        run: cp .env.example .env

      - name: Run Expo prebuild
        working-directory: ./mobile
        run: bun expo prebuild --platform android

      - name: Build release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --build-cache --parallel
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foverlay-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
